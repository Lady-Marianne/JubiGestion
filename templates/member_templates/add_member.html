<!-- /templates/member_templates/add_member.html -->

{% extends "layout.html" %}

{% block title %}Agregar nuevo socio{% endblock %}

{% block content %}
<h1>Agregar nuevo socio:</h1>

<form id="add-member-form">
    <label for="dni">DNI:</label>
    <input type="text" name="dni" id="dni" required><br>

    <div class="form-row">
    <label for="gender" class="label-inline"><strong>Sexo:</strong></label>
    <div class="radio-group">
        <label><input type="radio" name="gender" value="M"> Masculino</label>
        <label><input type="radio" name="gender" value="F"> Femenino</label>
    </div>
    </div>

    <label for="first_names">Nombres:</label>
    <input type="text" name="first_names" id="first_names" required><br>

    <label for="last_name">Apellido:</label>
    <input type="text" name="last_name" id="last_name" required><br>

    <label for="member_type">Tipo de socio:</label>
    <select name="member_type" id="member_type" required>
        <option value="JUBILADO" selected>Jubilado</option>
        <option value="PENSIONADO">Pensionado</option>
        <option value="ADHERENTE">Adherente</option>
    </select>
    <br>

    <label for="health_plan">Obra social:</label>
    <select name="health_plan" id="health_plan">
        <option value="PAMI" selected>PAMI</option>
        <option value="IAPOS">IAPOS</option>
        <option value="OSECAC">OSECAC</option>
        <option value="OSDE">OSDE</option>
        <option value="GALENO">GALENO</option>
        <option value="NINGUNA">NINGUNA</option>
        <option value="OTRA">Otra</option>
    </select>
    <br>

    <label for="affiliate_number">Nro. de afiliado de la obra social (si tiene):</label>
    <input type="text" name="affiliate_number" id="affiliate_number"><br>

    <label for="birth_date">Fecha de nacimiento:</label>
    <input type="date" name="birth_date" id="birth_date" required><br>

    <label for="phone">Teléfono:</label>
    <input type="text" name="phone" id="phone" required><br>

    <label for="email">Correo electrónico:</label>
    <input type="email" name="email" id="email" required><br>

    <label for="address">Dirección:</label>
    <input type="text" name="address" id="address" required><br>

    <label for="marital_status">Estado civil:</label>
    <input type="text" name="marital_status" id="marital_status" required><br>

    <label for="nationality">Nacionalidad:</label>
    <input type="text" name="nationality" id="nationality" value="Argentina" required><br>

    <label for="join_date">Fecha de ingreso:</label>
    <input type="date" name="join_date" id="join_date" required><br>

    <!-- Container for error or success messages:-->
    <div id="message-box"></div>

    <button type="submit">Guardar</button>
</form>


{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='scripts/utils/messages.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/member_scripts/add_member.js') }}"></script>
{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
{% endblock %}
