<!-- static/templates/member_templates/edit_member.html -->

{% extends "layout.html" %}

{% block title %}Editar Socio{% endblock %}

{% block content %}
<h2>Editar Socio</h2>

<form id="edit-member-form" data-member-id="{{ member.id }}">

    <label for="gender">Sexo:</label>
    <select name="gender" required>
        <option value="M" {% if member.gender == 'M' %}selected{% endif %}>Masculino</option>
        <option value="F" {% if member.gender == 'F' %}selected{% endif %}>Femenino</option>
    </select><br>

    <label for="dni">DNI:</label>
    <input type="text" name="dni" value="{{ member.dni[1:] if member.dni|length == 8 and not member.dni[0].isdigit() else member.dni }}">

    <label for="first_names">Nombres:</label>
    <input type="text" name="first_names" value="{{ member.first_names }}" required><br>

    <label for="last_name">Apellidos:</label>
    <input type="text" name="last_name" value="{{ member.last_name }}" required><br>

    <label for="member_type">Tipo de Socio:</label>
    <select name="member_type" required>
        <option value="JUBILADO" {% if member.member_type == 'JUBILADO' %}selected{% endif %}>Jubilado</option>
        <option value="PENSIONADO" {% if member.member_type == 'PENSIONADO' %}selected{% endif %}>Pensionado</option>
        <option value="ADHERENTE" {% if member.member_type == 'ADHERENTE' %}selected{% endif %}>Adherente</option>
    </select><br>

    <label for="health_plan">Obra Social:</label>
    <select name="health_plan" id="health_plan" required>
        {% for plan in ['PAMI', 'IAPOS', 'OSECAC', 'OSDE', 'GALENO', 'NINGUNA', 'OTRA'] %}
            <option value="{{ plan }}" {% if member.health_plan.value == plan %}selected{% endif %}>
                {{ plan }}
            </option>
        {% endfor %}
    </select><br>
    <!-- Field for "OTRA" that appears only if "OTRA" is selected -->
    <div id="other_health_plan_field" style="display: {% if member.health_plan.value != 'OTRA' %}none{% endif %};">        
        <label for="other_health_plan">Especifique otra obra social:</label>
        <input type="text" name="other_health_plan" id="other_health_plan" value="{{ member.other_health_plan or '' }}">
    </div> 

    <label for="affiliate_number">Nro. de Afiliado:</label>
    <input type="text" name="affiliate_number" value="{{ member.affiliate_number }}"><br>

    <label for="birth_date">Fecha de Nacimiento:</label>
    <input type="date" name="birth_date" value="{{ member.birth_date }}" required><br>

    <label for="phone">Teléfono:</label>
    <input type="tel" name="phone" value="{{ member.phone }}" required><br>

    <label for="email">Correo Electrónico:</label>
    <input type="email" name="email" value="{{ member.email }}" required><br>

    <label for="address">Dirección:</label>
    <input type="text" name="address" value="{{ member.address }}" required><br>

    <label for="marital_status">Estado Civil:</label>
    <select name="marital_status" required>
        <option value="SOLTERO" {% if member.marital_status == 'SOLTERO' %}selected{% endif %}>Soltero/a</option>
        <option value="CASADO" {% if member.marital_status == 'CASADO' %}selected{% endif %}>Casado/a</option>
        <option value="CONVIVIENTE" {% if member.marital_status == 'CONVIVIENTE' %}selected{% endif %}>Conviviente</option>
        <option value="VIUDO" {% if member.marital_status == 'VIUDO' %}selected{% endif %}>Viudo/a</option>
        <option value="DIVORCIADO" {% if member.marital_status == 'DIVORCIADO' %}selected{% endif %}>Divorciado/a</option>
    </select><br>

    <label for="nationality">Nacionalidad:</label>
    <input type="text" name="nationality" value="{{ member.nationality }}" required><br>    

    <label for="status">Estado:</label>
    <select name="status">
        <option value="ACTIVO" {% if member.status == 'ACTIVO' %}selected{% endif %}>Activo</option>
        <option value="SUSPENDIDO" {% if member.status == 'SUSPENDIDO' %}selected{% endif %}>Suspendido</option>
        <option value="ELIMINADO" {% if member.status == 'ELIMINADO' %}selected{% endif %}>Eliminado</option>
    </select><br>

    <label for="join_date">Fecha de Ingreso:</label>
    <input type="date" name="join_date" value="{{ member.join_date }}" required><br>

    <!-- Container for error or success messages-->
    <div id="message-box"></div>
    
    <div class="form-actions">
        <button type="submit" class="btn-save">Guardar</button>
        <button id="cancel-button" type="button" class="btn-cancel"
            data-url="{{ url_for('person.show_persons', kind='member', status=member.status) }}">
            Cancelar
        </button>
    </div>
</form>

<script>
    document.getElementById('health_plan').addEventListener('change', function() {
        const otherField = document.getElementById('other_health_plan_field');
        otherField.style.display = this.value === 'OTRA' ? 'block' : 'none';
    });
</script>

{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='scripts/utils/messages.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/member_scripts/edit_member.js') }}"></script>
{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
{% endblock %}
